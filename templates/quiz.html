<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: #fff;

            font-family: Arial, sans-serif;
        }

        header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            font-weight: normal;
        }

        header a {
            color: #888;
            text-decoration: none;
        }

        .container {
            width: 92%;
            max-width: 850px;

            margin: 45px auto;
        }

        .top {
            display: flex;

            justify-content: space-between;

            color: #888;

            margin-bottom: 12px;
        }

        .progress-bg {
            height: 5px;

            background: #222;

            border-radius: 10px;

            margin-bottom: 30px;
        }

        .progress {
            height: 100%;

            background: white;

            width: 0%;

            transition: 0.3s;
        }

        .question-card {
            background: #0b0b0b;

            border: 1px solid #252525;

            border-radius: 18px;

            padding: 35px;
        }

        .meta {
            color: #777;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .question {
            font-size: 25px;

            line-height: 1.5;

            margin-bottom: 25px;
        }

        .options {
            display: grid;

            gap: 12px;
        }

        .option {
            padding: 16px;

            text-align: left;

            background: #111;

            color: white;

            border: 1px solid #292929;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }

        .option:hover {
            background: #fff;

            color: #000;
        }

        .option.selected {
            background: #fff;

            color: #000;

            border-color: white;
        }

        .navigation {
            display: flex;

            justify-content: space-between;

            margin-top: 20px;

            gap: 10px;
        }

        button {
            padding: 13px 22px;

            border: none;

            border-radius: 9px;

            background: white;

            color: black;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            background: #222;

            color: #666;

            cursor: not-allowed;
        }

        #result {
            display: none;
        }

        .result-title {
            text-align: center;

            margin-bottom: 35px;
        }

        .score {
            font-size: 55px;

            font-weight: bold;

            margin: 15px 0;
        }

        .review-card {
            background: #0b0b0b;

            border: 1px solid #252525;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 15px;
        }

        .wrong {
            border-left: 4px solid #777;
        }

        .correct {
            border-left: 4px solid white;
        }

        .answer {
            margin-top: 15px;

            color: #aaa;

            line-height: 1.7;
        }

        .explanation {
            margin-top: 15px;

            background: #111;

            padding: 15px;

            border-radius: 10px;

            color: #ddd;

            line-height: 1.6;
        }

        @media(max-width:600px) {

            .question-card {
                padding: 22px;
            }

            .question {
                font-size: 20px;
            }

            .navigation {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        Aptitude<span>Coach</span>
    </div>

    <a href="/">
        Home
    </a>

</header>


<div class="container">


    <div id="quiz">

        <div class="top">

            <span id="questionNumber">
                Loading...
            </span>

            <span id="answered">
                0 answered
            </span>

        </div>


        <div class="progress-bg">

            <div
                class="progress"
                id="progress"
            ></div>

        </div>


        <div class="question-card">

            <div
                class="meta"
                id="meta"
            >
            </div>


            <div
                class="question"
                id="question"
            >
                Loading...
            </div>


            <div
                class="options"
                id="options"
            >
            </div>

        </div>


        <div class="navigation">

            <button
                id="previous"
                onclick="previousQuestion()"
            >
                ← Previous
            </button>


            <button
                id="next"
                onclick="nextQuestion()"
            >
                Next →
            </button>


            <button
                id="submit"
                onclick="submitQuiz()"
                style="display:none"
            >
                Final Submit ✓
            </button>

        </div>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div class="result-title">

            <h1>
                Quiz Completed
            </h1>

            <div
                class="score"
                id="score"
            >
                0 / 0
            </div>

            <p id="accuracy">
                Accuracy: 0%
            </p>

        </div>


        <h2>
            Answer Review
        </h2>

        <br>

        <div id="review"></div>


        <button
            onclick="location.href='/'"
        >
            Back Home
        </button>

    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );


    const category =
        params.get("category") || "All";

    const topic =
        params.get("topic") || "All";

    const difficulty =
        params.get("difficulty") || "All";

    const limit =
        params.get("limit") || "5";


    let questions = [];

    let answers = [];

    let current = 0;


    async function loadQuestions() {

        const url =
            `/api/questions?category=${encodeURIComponent(category)}
            &topic=${encodeURIComponent(topic)}
            &difficulty=${encodeURIComponent(difficulty)}
            &limit=${limit}`;


        const response =
            await fetch(
                url.replace(/\s/g, "")
            );


        questions =
            await response.json();


        if (questions.length === 0) {

            alert(
                "No questions found for this selection."
            );

            window.location.href =
                "/quiz";

            return;

        }


        answers =
            new Array(
                questions.length
            ).fill(null);


        showQuestion();

    }


    function showQuestion() {

        const q =
            questions[current];


        document.getElementById(
            "questionNumber"
        ).innerText =
            `Question ${current + 1} of ${questions.length}`;


        const count =
            answers.filter(
                x => x !== null
            ).length;


        document.getElementById(
            "answered"
        ).innerText =
            `${count} answered`;


        document.getElementById(
            "progress"
        ).style.width =
            `${((current + 1) / questions.length) * 100}%`;


        document.getElementById(
            "meta"
        ).innerText =
            `${q.category} • ${q.topic} • ${q.difficulty}`;


        document.getElementById(
            "question"
        ).innerText =
            q.question;


        const options =
            document.getElementById(
                "options"
            );


        options.innerHTML = "";


        q.options.forEach(
            function(option) {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "option";


                button.innerText =
                    option;


                if (
                    answers[current]
                    === option
                ) {

                    button.classList.add(
                        "selected"
                    );

                }


                button.onclick =
                    function() {

                        answers[current] =
                            option;

                        showQuestion();

                    };


                options.appendChild(
                    button
                );

            }
        );


        document.getElementById(
            "previous"
        ).disabled =
            current === 0;


        const next =
            document.getElementById(
                "next"
            );

        const submit =
            document.getElementById(
                "submit"
            );


        if (
            current ===
            questions.length - 1
        ) {

            next.style.display =
                "none";

            submit.style.display =
                "block";

            submit.disabled =
                answers.some(
                    x => x === null
                );

        }

        else {

            next.style.display =
                "block";

            submit.style.display =
                "none";

            next.disabled =
                answers[current] === null;

        }

    }


    function nextQuestion() {

        if (
            current <
            questions.length - 1
        ) {

            current++;

            showQuestion();

        }

    }


    function previousQuestion() {

        if (current > 0) {

            current--;

            showQuestion();

        }

    }


    function submitQuiz() {

        let score = 0;


        questions.forEach(
            function(q, index) {

                if (
                    answers[index]
                    === q.answer
                ) {

                    score++;

                }

            }
        );


        document.getElementById(
            "quiz"
        ).style.display =
            "none";


        document.getElementById(
            "result"
        ).style.display =
            "block";


        document.getElementById(
            "score"
        ).innerText =
            `${score} / ${questions.length}`;


        document.getElementById(
            "accuracy"
        ).innerText =
            `Accuracy: ${Math.round(
                score / questions.length * 100
            )}%`;


        showReview();

    }


    function showReview() {

        const review =
            document.getElementById(
                "review"
            );


        review.innerHTML = "";


        questions.forEach(
            function(q, index) {

                const correct =
                    answers[index]
                    === q.answer;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    `review-card ${
                        correct
                        ? "correct"
                        : "wrong"
                    }`;


                card.innerHTML = `

                    <h3>
                        ${
                            correct
                            ? "✓ Correct"
                            : "✗ Wrong"
                        }
                    </h3>

                    <br>

                    <p>
                        ${q.question}
                    </p>

                    <div class="answer">

                        Your Answer:
                        <strong>
                            ${answers[index]}
                        </strong>

                        <br>

                        Correct Answer:
                        <strong>
                            ${q.answer}
                        </strong>

                    </div>

                    ${
                        !correct
                        ?
                        `
                        <div class="explanation">

                            <strong>
                                Explanation
                            </strong>

                            <br><br>

                            ${q.explanation}

                        </div>
                        `
                        :
                        ""
                    }

                `;


                review.appendChild(
                    card
                );

            }
        );

    }


    loadQuestions();

</script>


</body>

</html>
