<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            background: #000;

            color: white;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .box {
            width: 90%;
            max-width: 400px;

            padding: 35px;

            background: #0b0b0b;

            border: 1px solid #252525;

            border-radius: 18px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #777;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            background: #111;

            color: white;

            border: 1px solid #333;

            border-radius: 8px;

            outline: none;
        }

        button {
            width: 100%;

            padding: 14px;

            background: white;

            color: black;

            border: none;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;
        }

        .error {
            color: #aaa;

            margin-bottom: 15px;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #777;

            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="box">

    <h1>
        Admin Login
    </h1>

    <p>
        Manage Aptitude Coach questions
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/admin/login"
    >

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    <a
        href="/"
        class="back"
    >
        ← Back to Home
    </a>

</div>

</body>

</html>
